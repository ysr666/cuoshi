name: Cuoshi cross-platform CI

on:
  push:
    branches:
      - design/editorial-ui-v04-preview
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, H5 and WeChat builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Build H5
        run: npm run build:h5
      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin

      - name: Set up Chrome for real H5 browser checks
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: H5 layout, typography and refinement
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:h5:layout && npm run test:h5:typography && npm run test:h5:refinement

      - name: Upload H5 screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5-review-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/cuoshi-type-setting-*.png
            /tmp/cuoshi-refined-*.png
