name: Cuoshi cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, H5 and WeChat builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Isolated future cloud authorization and snapshot contracts
        run: npm run test:future:cloud
      - name: WeChat backup bridge contracts
        run: npm run test:wechat:backup-bridge
      - name: Build H5
        run: npm run build:h5
      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin

      - name: Ensure future cloud code cannot enter v0.4 bundles
        run: npm run test:future:isolation

      - name: Install Chinese font fallback for visual review
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Set up Chrome for real H5 browser checks
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: H5 layout, typography, touch feedback and notes
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:h5:layout && npm run test:h5:typography && npm run test:h5:refinement && npm run test:h5:notes && npm run test:h5:feedback && npm run test:h5:polish && npm run test:h5:audit && npm run test:h5:extended && npm run test:h5:date-boundaries && npm run test:h5:release

      - name: Upload H5 screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5-review-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/cuoshi-type-setting-*.png
            /tmp/cuoshi-refined-*.png
            /tmp/cuoshi-feedback-*.png
            /tmp/cuoshi-polish-editor-*.png
            /tmp/cuoshi-audit-year-zero-*.png
            /tmp/cuoshi-release-privacy-*.png

  cloud_postgres:
    name: Real PostgreSQL cloud contract (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install shared TypeScript compiler
        run: npm ci
      - name: Install isolated PostgreSQL client
        run: npm ci --prefix future/server --ignore-scripts --no-audit
      - name: Migrate and test disposable PostgreSQL schema
        env:
          CUOSHI_TEST_POSTGRES_URL: postgresql://postgres:ci_only_disposable@127.0.0.1:5432/postgres
        run: npm test --prefix future/server
