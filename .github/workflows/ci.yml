name: Cuoshi cross-platform CI

on:
  push:
    branches:
      - design/editorial-ui-v04-preview
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, H5 and WeChat builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Build H5
        run: npm run build:h5
      - name: Build WeChat Mini Program
        run: npm run build:mp-weixin
